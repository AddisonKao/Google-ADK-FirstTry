<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kafka ADK Agent</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 60px auto; padding: 0 20px; }
    h1 { font-size: 1.4rem; margin-bottom: 24px; }
    textarea { width: 100%; height: 80px; padding: 8px; font-size: 1rem; box-sizing: border-box; }
    button { margin-top: 10px; padding: 8px 20px; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-top: 14px; color: #888; font-size: 0.9rem; }
    #response { margin-top: 20px; padding: 14px; background: #f4f4f4; border-radius: 6px;
                min-height: 60px; white-space: pre-wrap; font-size: 0.95rem; display: none; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #ccc;
               border-top-color: #555; border-radius: 50%; animation: spin 0.8s linear infinite;
               margin-right: 6px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>Kafka ADK Agent PoC</h1>
  <textarea id="message" placeholder="Type a message to the agent..."></textarea>
  <br/>
  <button id="submit" onclick="sendMessage()">Send</button>

  <div id="status"></div>
  <div id="response"></div>

  <script>
    async function sendMessage() {
      const message = document.getElementById('message').value.trim();
      if (!message) return;

      const btn = document.getElementById('submit');
      const statusEl = document.getElementById('status');
      const responseEl = document.getElementById('response');

      btn.disabled = true;
      responseEl.style.display = 'none';
      statusEl.innerHTML = '<span class="spinner"></span>Sending to agent...';

      try {
        const res = await fetch('/invoke', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        const { correlation_id } = await res.json();
        statusEl.innerHTML = `<span class="spinner"></span>Waiting for response (id: ${correlation_id.slice(0,8)}...)`;
        await pollResult(correlation_id);
      } catch (e) {
        statusEl.textContent = 'Error: ' + e.message;
        btn.disabled = false;
      }
    }

    async function pollResult(correlation_id) {
      const btn = document.getElementById('submit');
      const statusEl = document.getElementById('status');
      const responseEl = document.getElementById('response');

      for (let i = 0; i < 60; i++) {
        await new Promise(r => setTimeout(r, 1000));
        const res = await fetch(`/result/${correlation_id}`);
        if (res.status === 200) {
          const data = await res.json();
          statusEl.textContent = 'Done.';
          responseEl.style.display = 'block';
          responseEl.textContent = data.response;
          btn.disabled = false;
          return;
        }
      }
      statusEl.textContent = 'Timed out waiting for response.';
      btn.disabled = false;
    }
  </script>
</body>
</html>
